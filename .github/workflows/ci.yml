# .github/workflows/ci.yml
name: CI - Build & Push Docker

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: ${{ secrets.IMAGE_NAME }}  # dockerhub/repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: |
          if npm run -s lint; then
            echo "Lint OK"
          else
            echo "No lint script or lint failed, continuing..."
          fi
        continue-on-error: true

      - name: Run tests
        run: |
          if npm test --silent; then
            echo "Tests passed or none exist"
          else
            echo "Tests failed or none exist, continuing..."
          fi
        continue-on-error: true

      - name: Build Next.js production
        run: npm run build

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.IMAGE_NAME }}:latest

