# k8s/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: next-japan
  labels:
    app: next-japan
spec:
  replicas: 2
  selector:
    matchLabels:
      app: next-japan
  template:
    metadata:
      labels:
        app: next-japan
    spec:
      containers:
        - name: next-japan
          image: rakib770/next-japan:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"

